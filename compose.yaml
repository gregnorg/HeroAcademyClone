name: crystal-tactics
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PGHOST: db
      PGDATABASE: tactics
      PGUSER: tactics
      PGPASSWORD: ${POSTGRES_PASSWORD:?Create .env using the README instructions}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tactics
      POSTGRES_USER: tactics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env using the README instructions}
    volumes:
      - match-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactics -d tactics"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  match-data:
